version: "3"

tasks:
  generate-config-code:
    desc: "Generate Config Code"
    dir: "{{.TASKFILE_DIR}}"
    vars:
      # 生成先落到 staging，再按内容稳定发布到 OUTPUT_DIR，未变化的输出不重写
      STAGING_DIR: '{{.STAGING_DIR | default (print .OUTPUT_DIR ".staging")}}'
    cmds:
      - cmd: pwsh -NoProfile -ExecutionPolicy Bypass -File "{{.TASKFILE_DIR}}/generate-config-code.ps1" -PythonBin "{{.PYTHON_BIN_PATH}}" -GenScript "{{.XRESLOADER_GEN_PYTHON}}" -TemplateDir "{{.PROJECT_ROOT}}/template" -ResConfigPb "{{.RES_CONFIG_PB}}" -ImportPath "{{.CONFIG_PROTOCOL_IMPORT_PATH}}" -OutputDir "{{.OUTPUT_DIR}}" -StagingDir "{{.STAGING_DIR}}"
        platforms: [windows]
      - cmd: sh "{{.TASKFILE_DIR}}/generate-config-code.sh" "{{.PYTHON_BIN_PATH}}" "{{.XRESLOADER_GEN_PYTHON}}" "{{.PROJECT_ROOT}}/template" "{{.RES_CONFIG_PB}}" "{{.CONFIG_PROTOCOL_IMPORT_PATH}}" "{{.OUTPUT_DIR}}" "{{.STAGING_DIR}}"
        platforms: [linux, darwin]
    silent: true
